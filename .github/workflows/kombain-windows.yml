name: Kombain for Windows
# Builds Kombain (Windows x64): the Go core + SSH helper on Linux, the Qt app with MSVC on Windows,
# then a portable zip and an installer. Push a tag like v1.0.0 to publish a GitHub release.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
env:
  GO_VERSION: "1.27.3"
  PROTOC_VERSION: "36.2"
  QT_VERSION: "6.12.0"
jobs:
  build-go:
    runs-on: ubuntu-22.04
    env:
      DEST: ${{ github.workspace }}/deployment/windows-amd64
      KOMBAIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Install protoc
        run: |
          curl -fLso "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Build core and kombain-node
        run: GOOS=windows GOARCH=amd64 ./script/build_go.sh
      - run: tar czf artifacts.tgz ./deployment
      - uses: actions/upload-artifact@v4
        with:
          name: core-windows-amd64
          path: artifacts.tgz
          compression-level: 0

  build-app:
    needs: build-go
    runs-on: windows-latest
    env:
      DEST: ${{ github.workspace }}/deployment/windows-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Web dashboard
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundle dashboard
        shell: bash
        run: |
          rm -rf dashboard-src/.git || true
          cp -R dashboard-src/. res/dashboard/
      - name: MSVC
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -prerelease -property installationPath
          $bat = Join-Path $env:RUNNER_TEMP 'vcvars.cmd'
          Set-Content -LiteralPath $bat -Encoding ascii -Value "@call `"$vs\VC\Auxiliary\Build\vcvarsall.bat`" x64 >nul && set"
          $vars = & $bat
          $changed = foreach ($line in $vars) {
            $name, $value = $line -split '=', 2
            if ($null -ne $value -and $value -cne [Environment]::GetEnvironmentVariable($name)) { "$name=$value" }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $changed
      - uses: actions/download-artifact@v4
        with:
          name: core-windows-amd64
          path: download-artifact
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: |
            qt.7z
            openssl.7z
          key: WinQt-${{ env.QT_VERSION }}-x64
      - name: Download Qt and OpenSSL
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fL -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_${QT_VERSION}/Qt_${QT_VERSION}_x64.7z
          curl -fL -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_x64.7z
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="1.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        run: |
          7z x -y qt.7z > /dev/null
          7z x -y openssl.7z > /dev/null
          export INPUT_VERSION="${{ steps.ver.outputs.version }}"
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build && cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
          ninja
          cd ..
          ./script/deploy_windows.sh
      - name: Portable zip
        shell: pwsh
        run: |
          Remove-Item deployment\windows-amd64\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path deployment\windows-amd64\* -DestinationPath "deployment\Kombain-${{ steps.ver.outputs.version }}-windows-x64-portable.zip"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" script\kombain_installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Kombain-windows-x64
          path: |
            deployment/*.zip
            deployment/*setup.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deployment/*.zip
            deployment/*setup.exe
